[tool.poetry]
name = "python-tutorials"
version = "0.1.0"
description = "Python Tutorials for Learning"
authors = ["PythonTutorials <email@example.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
numpy = ">=1.20.0,<2.0"
jupyter = "^1.0.0"
ipykernel = "^6.0.0"
scipy = "^1.7.0"
matplotlib = "^3.3.0"
python-docx = "^0.8.0"
googletrans = "^4.0.0"
scikit-image = "^0.18.0"
gmpy2 = "^2.1.0"
plotly = "^5.0.0"
sympy = "^1.8"
pillow = "^10.0.0"
scikit-learn = "^1.0.0"
requests = "^2.25.0"
tensorflow = "2.17.0"
pydot = "^4.0.1"

[tool.poetry.group.dev.dependencies]
ipykernel = "^6.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api" 